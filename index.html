.scr{position:absolute;inset:0}

<script>
const $=s=>document.querySelector(s),st=$('#st');let AC,mute=false,tab=0;
function fit(){st.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1280,innerHeight/720)})`}fit();onresize=fit;
function snd(f,d=.1,t='sine',v=.15,w=0){if(mute)return;AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),T=AC.currentTime+w;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d)}
const S={ok:()=>[523,659,784].forEach((f,k)=>snd(f,.2,'sine',.15,k*.1)),no:()=>{snd(200,.25,'sawtooth',.08);snd(150,.3,'sawtooth',.08,.12)},start:()=>[392,523,659,784].forEach((f,k)=>snd(f,.3,'sine',.15,k*.09))};
document.addEventListener('click',e=>{if(e.target.closest('button'))snd(560,.07,'triangle',.1)});
let p=0;const iv=setInterval(()=>{p+=Math.random()*9+3;if(p>=100){p=100;clearInterval(iv);$('#go').style.display='inline-block';$('#lt').textContent='Siap! Lab maya sudah dimuat 100%'}else $('#lt').textContent='Memuat lab maya… '+Math.floor(p)+'%';$('#lb').style.width=p+'%'},180);
function start(){S.start();$('#ld').style.display='none';$('#mn').style.display='block';go(0)}
const TABS=['📘 Teori','🧭 Prosedur','🧪 Simulasi','📝 LKPD','👤 Pengembang'];
$('#bar').innerHTML=TABS.map((t,k)=>`<button class=tb onclick=go(${k})>${t}</button>`).join('')+'<span style="flex:1"></span><button class=ic title=Reset onclick=rs()>↺</button><button class=ic title=Suara onclick="mute=!mute;this.textContent=mute?\'🔇\':\'🔊\'">🔊</button><button class=ic title="Layar penuh" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶</button>';
function go(n){tab=n;document.querySelectorAll('.tb').forEach((b,k)=>b.classList.toggle('on',k==n));$('#c').innerHTML=V[n]();if(n==2)calc();if(n==3)quiz()}
function rs(){if(tab==3){i=0;sc=0}go(tab);S.start()}
const V=[()=>`<h2>Pertumbuhan &amp; Pembangunan Ekonomi</h2><div class=g2>
<div class=k><h3>📈 Pertumbuhan Ekonomi</h3>Kenaikan output/PDB riil suatu negara dalam periode tertentu. Bersifat <b>kuantitatif</b>, diukur dengan PDB harga konstan (bebas pengaruh inflasi). Pendorong: SDM, modal, teknologi, SDA, kewirausahaan.</div>
<div class="k y"><h3>🧮 Rumus Laju Pertumbuhan Ekonomi (LPE)</h3><div class=fm>LPE = (PDB<sub>t</sub> − PDB<sub>t-1</sub>) / PDB<sub>t-1</sub> × 100%</div>Contoh: PDB 10.800 T → 11.400 T, maka LPE = (600/10.800) × 100% = <b>5,56%</b>. PDB per kapita = PDB ÷ jumlah penduduk.</div>
<div class="k g"><h3>🏗️ Pembangunan Ekonomi</h3>Proses peningkatan kesejahteraan yang disertai perubahan struktur ekonomi, pemerataan, dan kualitas hidup. Bersifat <b>kualitatif</b>. Indikator: <b>IPM</b> (kesehatan, pendidikan, pengeluaran), <b>Koefisien Gini</b> (0 = merata, 1 = timpang), tingkat kemiskinan &amp; pengangguran.</div>
<div class="k o"><h3>⚖️ Perbedaan Singkat</h3>• Pertumbuhan: angka PDB naik, jangka pendek-menengah, kuantitatif.<br>• Pembangunan: kualitas hidup &amp; struktur membaik, jangka panjang, kualitatif.<br>• Pertumbuhan tinggi <i>belum tentu</i> merata. Hambatan: korupsi, SDM rendah, infrastruktur terbatas, ketimpangan.</div></div>`,
()=>`<h2>Prosedur Penggunaan Lab Maya</h2><div class=g2><ol><li>Baca tab <b>Teori</b> sampai paham perbedaan pertumbuhan &amp; pembangunan ekonomi.</li><li>Buka tab <b>Simulasi</b>, geser slider PDB tahun sebelumnya dan PDB tahun ini.</li><li>Tekan <b>▶ Hitung</b> dan catat nilai LPE serta PDB per kapita.</li><li>Tekan <b>🎲 Acak</b> atau <b>🇮🇩 Contoh</b> untuk 3 data berbeda; bandingkan hasilnya.</li></ol><ol start=5><li>Geser slider indeks kesehatan, pendidikan, pengeluaran untuk menghitung <b>IPM</b>.</li><li>Kerjakan <b>LKPD</b>: 30 soal, pembahasan muncul setelah tiap soal dijawab.</li><li>Lihat skor akhir. Tekan <b>↺ Reset</b> kapan saja untuk mengulang tab aktif.</li><li>Aktifkan <b>⛶</b> untuk layar penuh dan <b>🔊</b> untuk mengatur suara.</li></ol></div><div class="k y" style="margin-top:14px"><b>Tugas diskusi:</b> Bisakah LPE tinggi tetapi IPM rendah? Jelaskan dengan data dari simulasi.</div>`,
